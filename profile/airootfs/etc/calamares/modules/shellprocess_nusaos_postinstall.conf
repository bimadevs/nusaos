# ==============================================================================
# NusaOS Calamares Post-Install Cleanup Module
# Cleans live user artifacts and provisions the installed system
# ==============================================================================
---
dontChroot: false
timeout: 60
script:
    - "-userdel -r -f nusa"
    - "-rm -f /etc/sudoers.d/00_liveuser"
    - "-rm -f /etc/sddm.conf.d/autologin.conf"
    - "-rm -f /etc/systemd/system/multi-user.target.wants/choose-mirror.service"
    - "-rm -f /etc/systemd/system/multi-user.target.wants/livecd-talk.service"
    - "-rm -f /etc/systemd/system/multi-user.target.wants/pacman-init.service"
    - "-rm -f /etc/systemd/system/getty@tty1.service.d/autologin.conf"
    - "-systemctl enable NetworkManager.service"
    - "-systemctl enable sddm.service"
    - "-systemctl enable bluetooth.service"
    - "-systemctl enable power-profiles-daemon.service"

i18n:
    name: "Membersihkan konfigurasi media live dan mematangkan sistem NusaOS..."
