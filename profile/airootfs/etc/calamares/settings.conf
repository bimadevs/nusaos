# ==============================================================================
# NusaOS Calamares Main Settings
# ==============================================================================
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       nusaos_postinstall
  module:   shellprocess
  config:   shellprocess_nusaos_postinstall.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader
  - shellprocess@nusaos_postinstall
  - umount
- show:
  - finished

branding: nusaos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
