LABEL nusa
TEXT HELP
Boot the NusaOS install medium on BIOS.
It allows you to install NusaOS or perform system maintenance.
ENDTEXT
MENU LABEL NusaOS install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G %KERNEL_PARAMS%

# Accessibility boot option
LABEL nusaspeech
TEXT HELP
Boot the NusaOS install medium on BIOS with speakup screen reader.
It allows you to install NusaOS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL NusaOS install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G accessibility=on %KERNEL_PARAMS%
