LABEL nusa_nbd
TEXT HELP
Boot the NusaOS install medium using NBD.
It allows you to install NusaOS or perform system maintenance.
ENDTEXT
MENU LABEL NusaOS install medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G archiso_nbd_srv=${pxeserver} cms_verify=y %KERNEL_PARAMS%
SYSAPPEND 3

LABEL nusa_nfs
TEXT HELP
Boot the NusaOS live medium using NFS.
It allows you to install NusaOS or perform system maintenance.
ENDTEXT
MENU LABEL NusaOS install medium (%ARCH%, NFS)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% cow_spacesize=4G archiso_nfs_srv=${pxeserver}:/run/archiso/bootmnt cms_verify=y %KERNEL_PARAMS%
SYSAPPEND 3

LABEL nusa_http
TEXT HELP
