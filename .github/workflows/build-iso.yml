name: Build NusaOS ISO

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish ISO to GitHub Releases'
        type: boolean
        default: false
        required: false
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build & Package ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Disk Space on Runner
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          docker image prune -af 2>/dev/null || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Build NusaOS ISO in Arch Linux Container
        run: |
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel bash -c "
              set -euo pipefail
              
              echo '::group::Initialize Arch Linux Keyring & Dependencies'
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Syu --noconfirm --needed \
                archiso \
                pacman-contrib \
                git \
                curl \
                zstd \
                libisoburn \
                squashfs-tools \
                dosfstools \
                e2fsprogs \
                mtools \
                libarchive \
                sed \
                awk
              echo '::endgroup::'

              echo '::group::Setup Custom Repository & PKGBUILDs'
              bash scripts/setup_customrepo.sh
              echo '::endgroup::'

              echo '::group::Validate Archiso Profile'
              bash scripts/validate_profile.sh profile
              echo '::endgroup::'

              echo '::group::Compile NusaOS Live ISO'
              mkdir -p out
              mkarchiso -v -w /tmp/archiso-work -o out profile
              echo '::endgroup::'
            "

      - name: Generate SHA256 Checksums
        run: |
          cd out
          sha256sum nusaos-*.iso > sha256sums.txt
          echo "Generated Checksums:"
          cat sha256sums.txt

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nusaos-iso
          path: |
            out/nusaos-*.iso
            out/sha256sums.txt
          retention-days: 7
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: |
          github.event_name == 'release' || 
          (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/nusaos-*.iso
            out/sha256sums.txt
          generate_release_notes: true
          fail_on_unmatched_files: false
