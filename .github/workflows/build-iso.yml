name: Build NusaOS ISO

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish ISO to GitHub Releases'
        type: boolean
        default: false
        required: false
  push:
    branches:
      - main
    paths:
      - 'profile/**'
      - 'scripts/**'
      - 'customrepo/**'
      - 'build.sh'
      - '.github/workflows/build-iso.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'profile/**'
      - 'scripts/**'
      - 'customrepo/**'
      - 'build.sh'
      - '.github/workflows/build-iso.yml'
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build & Package NusaOS ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Disk Space on Runner
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/share/boost \
            2>/dev/null || true
          docker image prune -af 2>/dev/null || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Compile NusaOS Live ISO via Docker (Arch Linux)
        run: |
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel bash -c "
              set -euo pipefail

              echo '::group::1. Initialize Arch Linux Keyring & Mirror'
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Syu --noconfirm --needed \
                archiso \
                pacman-contrib \
                git \
                curl \
                zstd \
                libisoburn \
                squashfs-tools \
                dosfstools \
                e2fsprogs \
                mtools \
                libarchive \
                sed \
                awk
              echo '::endgroup::'

              echo '::group::2. Setup Custom Repository & PKGBUILDs'
              bash scripts/setup_customrepo.sh
              echo '::endgroup::'

              echo '::group::3. Validate Archiso Profile'
              bash scripts/validate_profile.sh profile
              echo '::endgroup::'

              echo '::group::4. Compile NusaOS Live ISO (mkarchiso)'
              mkdir -p out
              mkarchiso -v -w /tmp/archiso-work -o out profile
              chmod -R a+rw out
              echo '::endgroup::'
            "

      - name: Verify ISO and Generate Checksums
        run: |
          cd out
          ISO_FILE=$(ls nusaos-*.iso 2>/dev/null | head -n 1 || true)
          if [[ -z "${ISO_FILE}" || ! -f "${ISO_FILE}" ]]; then
            echo "❌ Error: Berkas ISO tidak ditemukan di out/!"
            exit 1
          fi
          
          echo "✅ ISO berhasil dikompilasi: ${ISO_FILE} ($(du -h "${ISO_FILE}" | cut -f1))"
          sha256sum "${ISO_FILE}" > sha256sums.txt
          sha256sum "${ISO_FILE}" > "${ISO_FILE}.sha256"
          cat sha256sums.txt

      - name: Upload ISO Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: nusaos-iso
          path: |
            out/nusaos-*.iso
            out/sha256sums.txt
          retention-days: 14
          if-no-files-found: error

      - name: Optional Upload to Google Drive (via rclone)
        if: env.RCLONE_CONFIG_B64 != ''
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          echo "Memasang rclone..."
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          echo "${RCLONE_CONFIG_B64}" | base64 -d > ~/.config/rclone/rclone.conf
          
          ISO_FILE=$(ls out/nusaos-*.iso | head -n 1)
          echo "Mengunggah ${ISO_FILE} ke Google Drive..."
          rclone copy "${ISO_FILE}" drive:/NusaOS/ -v --stats=30s
          rclone copy "out/sha256sums.txt" drive:/NusaOS/ -v
          echo "✅ Berhasil diunggah ke Google Drive."

      - name: Publish to GitHub Releases
        if: |
          github.event_name == 'release' || 
          (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/nusaos-*.iso
            out/sha256sums.txt
            out/*.sha256
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: false

      - name: Summary Report
        if: always()
        run: |
          ISO_FILE=$(ls out/nusaos-*.iso 2>/dev/null | head -n 1 || true)
          echo "## 🚀 NusaOS ISO Build Summary" >> $GITHUB_STEP_SUMMARY
          if [[ -n "${ISO_FILE}" && -f "${ISO_FILE}" ]]; then
            echo "| Item | Keterangan |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo "| **ISO File** | \`$(basename "${ISO_FILE}")\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Size** | \`$(du -h "${ISO_FILE}" | cut -f1)\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **SHA-256** | \`$(sha256sum "${ISO_FILE}" | cut -d' ' -f1)\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Status** | ✅ Selesai & Terverifikasi |" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build gagal atau ISO tidak terhasilkan." >> $GITHUB_STEP_SUMMARY
          fi
