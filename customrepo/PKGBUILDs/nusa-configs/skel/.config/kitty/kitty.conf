# ==============================================================================
# NusaOS Kitty Terminal Configuration
# Theme: Zamrud Khatulistiwa (Deep Obsidian & Emerald)
# ==============================================================================

# Typography
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Cursor
cursor                #00e5a3
cursor_text_color     #0d1117
cursor_shape          beam
cursor_blink_interval 0.5

# Window Layout
window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0

# Colors & Opacity
background_opacity 0.88
dynamic_background_opacity yes

background #0d1117
foreground #f0f6fc
selection_background #00b48a
selection_foreground #0d1117

# Normal Colors
color0 #161b22
color1 #ff7b72
color2 #00b48a
color3 #d29922
color4 #58a6ff
color5 #bc8cff
color6 #00e5a3
color7 #c9d1d9

# Bright Colors
color8  #484f58
color9  #ffa198
color10 #00e5a3
color11 #e3b341
color12 #79c0ff
color13 #d2a8ff
color14 #56d364
color15 #f0f6fc

# Keybindings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
